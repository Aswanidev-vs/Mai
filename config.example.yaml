# Mai - Offline AI Assistant Configuration
# All paths use forward slashes for cross-platform compatibility
#
# 1. Copy this file to config.yaml
# 2. Update paths to match your model locations
# 3. Download models from: https://github.com/k2-fsa/sherpa-onnx/releases

audio:
  sample_rate: 16000
  capture_buffer_ms: 100
  playback_device: ""
  barge_in_enabled: true
  barge_in_threshold: 0.008
  barge_in_echo_max: 0.7   # reject interruptions whose residual is this correlated with Mai's playback; 1 = off
  thinking_chime: true  # empty = default

# Background-noise suppression for the microphone (Sherpa-ONNX streaming
# DPDFNet). Stops stationary noise (fans, HVAC, hum) from reaching the
# wake-word spotter, VAD and ASR as speech. Needs a streaming export with the
# "dpdfnet_16khz" profile, e.g. dpdfnet8.onnx. Missing model = feature off.
denoise:
  enabled: true
  model: "dpdfnet8.onnx"
  provider: "cpu"
  num_threads: 2
  speech_ratio_min: 0.3  # denoised/raw energy ratio below which a frame is noise, not speech

kws:
  provider: "cpu"  # "cpu" | "cuda" (NVIDIA GPU) | "coreml" (macOS) | "opencl"
  num_threads: 2
  debug: 0
  model_dir: "./sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
  encoder: "encoder-epoch-12-avg-2-chunk-16-left-64.onnx"
  decoder: "decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
  joiner: "joiner-epoch-12-avg-2-chunk-16-left-64.onnx"
  tokens: "tokens.txt"
  keywords: "▁MA I @mai, ▁MY @mai, ▁HE Y ▁MA I @mai"  # Subword token version
  confidence_threshold: 0.02
  cooldown_ms: 1500

vad:
  provider: "cpu"  # "cpu" | "cuda" (NVIDIA GPU) | "coreml" (macOS) | "opencl"
  num_threads: 2
  debug: 0
  sample_rate: 16000
  model: "./silero_vad.onnx"

  window_size: 512
  threshold: 0.6
  min_silence_duration: 0.8
  min_speech_duration: 0.5
  max_speech_duration: 10.0
  buffer_size_seconds: 20

asr:
  # Active model: "qwen3" | "nemotron" | "omnilingual" | "transducer"
  active_model: "nemotron"
  provider: "cpu"  # "cpu" | "cuda" (NVIDIA GPU) | "coreml" (macOS) | "opencl"
  num_threads: 2
  debug: 0

  # Dual-model: use a secondary offline model for unsupported languages
  dual_mode:
    enabled: false
    fallback_model: "omnilingual"  # "qwen3" | "omnilingual"
    fallback_languages: ["ml"]     # Languages that trigger fallback (e.g. "ml" = Malayalam)

  # Qwen3-ASR (offline, LLM-based, 30+ languages)
  qwen3:
    model_dir: "./sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25"
    conv_frontend: "conv_frontend.onnx"
    encoder: "encoder.int8.onnx"
    decoder: "decoder.int8.onnx"
    tokenizer: "tokenizer"
    language: "en"
    decoding_method: "greedy_search"

  # Nemotron 3.5 (streaming transducer, 40 languages, Hindi supported).
  # model_dir selects the latency variant; the suffix in the directory name
  # (e.g. 560ms) is the export's chunk latency. All variants share this path.
  nemotron:
    model_dir: "./sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-560ms-int8-2026-06-11"
    encoder: "encoder.int8.onnx"
    decoder: "decoder.int8.onnx"
    joiner: "joiner.int8.onnx"
    tokens: "tokens.txt"
    language: "en"  # or "auto" for auto-detection
    decoding_method: "greedy_search"
    max_active_paths: 4
    enable_endpoint: 1
    rule1_min_trailing_silence: 2.4
    rule2_min_trailing_silence: 1.2
    rule3_min_utterance_length: 20

  # Omnilingual ASR (offline CTC, 1600+ languages incl. Malayalam)
  omnilingual:
    model_dir: "./sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-v2-int8-2026-02-05"
    model: "model.int8.onnx"
    tokens: "tokens.txt"
    language: "auto"

  # Transducer (Zipformer, Conformer, etc.)
  transducer:
    model_dir: "./sherpa-onnx-streaming-zipformer-en-2023-02-21"
    encoder: "encoder-epoch-99-avg-1.int8.onnx"
    decoder: "decoder-epoch-99-avg-1.int8.onnx"
    joiner: "joiner-epoch-99-avg-1.int8.onnx"
    tokens: "tokens.txt"
    language: "en"
    decoding_method: "greedy_search"
    max_active_paths: 4
    enable_endpoint: 1
    rule1_min_trailing_silence: 2.4
    rule2_min_trailing_silence: 1.2
    rule3_min_utterance_length: 20

tts:
  provider: "cpu"  # "cpu" | "cuda" (NVIDIA GPU) | "coreml" (macOS) | "opencl"
  num_threads: 2
  debug: 0
  output_sample_rate: 44100  # Supertonic outputs 44.1kHz, Pocket/ZipVoice may differ

  # Select active model: "supertonic" | "pocket" | "zipvoice"
  active_model: "supertonic"
  voice_style: ""  # Optional: "calm", "warm", "energetic", "serious", "soft"
  # output_gain: makeup gain applied to every synthesized sample, AFTER the
  # style/emotion volume. Style presets only ever attenuate, and Pocket ignores
  # `speed` entirely (its ONNX impl never reads it), so on Pocket a preset like
  # "calm" would do nothing except make her quieter. ~1.11 cancels the 0.9
  # volume "calm" applies. Keep <= ~1.4: the clamp is per-sample, so a model
  # whose raw output already peaks near full scale clips on the "excited" path
  # (volume 1.2).
  output_gain: 1.0
  # normalize_loudness: bring every utterance's active speech to
  # target_loudness_dbfs before the emotion volume is applied. Engines emit their
  # own conservative level (measured Pocket: -25.3 dBFS RMS, peak 0.486), and
  # output_gain cannot fix that per sentence — levels differ and the peak would
  # clip. A soft limiter replaces the per-sample hard clamp, so loud consonants
  # compress instead of crackling.
  normalize_loudness: true
  target_loudness_dbfs: -16.0  # normal program level; -14 is louder, -20 quieter

  supertonic:
    model_dir: "./sherpa-onnx-supertonic-3-tts-int8-2026-05-11"
    duration_predictor: "duration_predictor.int8.onnx"
    text_encoder: "text_encoder.int8.onnx"
    vector_estimator: "vector_estimator.int8.onnx"
    vocoder: "vocoder.int8.onnx"
    tts_json: "tts.json"
    unicode_indexer: "unicode_indexer.bin"
    voice_style: "voice.bin"
    sid: 0
    num_steps: 5
    speed: 1.25
    extra: '{"lang": "en"}'

  pocket:
    # Official Sherpa Pocket package. Leave bundle empty for Sherpa's API.
    model_dir: "./sherpa-onnx-pocket-tts-2026-01-26"
    streaming: true  # true = stream LLM sentences/audio; false = wait, then use sentence chunks
    lm_flow: "lm_flow.onnx"
    lm_main: "lm_main.onnx"
    encoder: "encoder.onnx"
    decoder: "decoder.onnx"
    text_conditioner: "text_conditioner.onnx"
    vocab_json: "vocab.json"
    token_scores_json: "token_scores.json"
    voice_embedding_cache_capacity: 50
    # Pocket's flow-matching sampler draws fresh Gaussian noise for every frame,
    # so it is stochastic: without these, sherpa's defaults (temperature 0.7,
    # random seed) give the same sentence a different timbre AND a different
    # loudness each run — measured peak 0.37 vs 0.56 for identical input. A
    # cloned voice that drifts like that reads as "not the reference voice".
    temperature: 0.7
    seed: 42             # any fixed integer; -1 restores the random default
    # Merge the sentences the LLM streaming handoff produces into ONE synthesis
    # call. Pocket pays a large fixed cost per call (fresh LM state + EOS
    # search), so measured realtime factor was:
    #   6 chars -> 1.13x  24 chars -> 2.04x  61 chars -> 2.23x  100 chars -> 2.20x
    # One sentence at a time left Pocket barely ahead of playback, which showed
    # up as silent gaps between sentences. The drain is non-blocking, so
    # first-audio latency is unchanged. Supertonic is 4.58x and unaffected.
    batch_sentences: true
    batch_max_chars: 160
    # Custom Colab Pocket export example. Set bundle to enable Mai's direct
    # bundle runtime and point model_dir at the custom package.
    # model_dir: "./sherpa-onnx-pocket-tts-english_2026-04-2026-09-04"
    # bundle: "bundle.json"
    # tokenizer: "tokenizer.model"
    # bos_before_voice: "bos_before_voice.npy"
    # precision: "int8"
    # temperature: 0.7
    # lsd_steps: 1
    # voice: "test_wavs/sample.wav"

  zipvoice:
    model_dir: "./sherpa-onnx-zipvoice-distill-int8-zh-en-emilia"
    encoder: "encoder.int8.onnx"
    decoder: "decoder.int8.onnx"
    data_dir: "espeak-ng-data"
    lexicon: "lexicon.txt"
    tokens: "tokens.txt"
    vocoder: "./vocos_24khz.onnx"  # ⚠️ MUST DOWNLOAD: https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos_24khz.onnx
    num_steps: 4
    speed: 1.0
    extra: '{"min_char_in_sentence": 10}'

  voice_cloning:
    enabled: false
    # Sherpa Pocket has NO built-in voice: without a readable reference WAV it
    # generates silence, so startup now fails loudly instead of going mute.
    reference_audio: "./mai_san_v2.wav"
    reference_text: ""  # Only for ZipVoice. Empty = auto-detect
    # How much of the reference the voice encoder sees. The encoded voice is
    # cached (voice_embedding_cache_capacity), so a higher value buys more
    # conditioning data without adding per-sentence latency.
    max_reference_audio_len: 30.0

llm:
  provider: "ollama"
  model: "gemma4:e2b-it-q4_K_M"
  url: "http://localhost:11434/api/generate"
  auto_start: true
  system_prompt: "You are Mai, a helpful and concise offline AI companion. Speak naturally with contractions and short spoken sentences. Use occasional paralinguistic cues like Hmm, Oh, Ah, Well, or Heh when genuinely fitting, and use punctuation for gentle pauses. Never use markdown, emojis, brackets, or stage directions."
  # Note: keep_alive / num_ctx intentionally omitted — Ollama manages model
  # residency (default 5-min unload) and auto-sizes the context by VRAM.
  sampling:
    temperature: 0.55
    top_p: 0.85
    # min_p filters low-probability tokens — small models benefit (~0.05).
    min_p: 0.05
    max_tokens: 400
