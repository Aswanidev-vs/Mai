<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mai - Face Recognition</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path>
                        <path d="M20 20v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    </svg>
                    <h1>Mai Face Recognition</h1>
                </div>
                <div class="status-badge" id="stream-status">
                    <span class="status-dot"></span>
                    Initializing...
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Left: Camera Feed -->
            <section class="camera-section">
                <div class="camera-container">
                    <div id="loader" class="loader">
                        <div class="spinner"></div>
                        <p>Accessing camera...</p>
                    </div>
                    <video id="webcam" autoplay playsinline muted></video>
                    <canvas id="overlay"></canvas>
                </div>
            </section>

            <!-- Right: Controls & Logs -->
            <aside class="sidebar">
                <!-- Enrollment Panel -->
                <div class="panel enroll-panel">
                    <h2 class="panel-title">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        Register Person
                    </h2>
                    <div class="enroll-form">
                        <input type="text" id="enroll-name" placeholder="Enter name..." maxlength="50" />
                        <div class="enroll-actions">
                            <button id="btn-capture" class="btn btn-capture">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                                Capture
                            </button>
                            <button id="btn-enroll" class="btn btn-enroll" disabled>Register</button>
                        </div>
                        <div class="photo-progress">
                            <span>Photos: <strong id="photo-count">0</strong>/5</span>
                            <button id="btn-reset" class="btn-reset" style="display:none;">Reset</button>
                        </div>
                        <div id="captured-photos" class="photo-thumbnails"></div>
                        <div id="enroll-message" class="message" style="display:none;"></div>
                    </div>
                </div>

                <!-- Detection Log -->
                <div class="panel log-panel">
                    <h2 class="panel-title">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 16v-4"></path>
                            <path d="M12 8h.01"></path>
                        </svg>
                        Detection Log
                    </h2>
                    <div id="logs" class="logs-container">
                        <div class="placeholder">Waiting for faces...</div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
