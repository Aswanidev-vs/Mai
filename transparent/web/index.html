<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Overlay</title>
    <style>
        /* The host window (transparent/main.go) gives the WebView2 a
           transparent background of its own, so the page has to leave the
           background alone: everything the canvas does not cover shows the
           desktop through the window. */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        body.dragging {
            cursor: grabbing;
        }

        #stage {
            position: fixed;
            inset: 0;
        }

        #stage canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "/node_modules/three/build/three.module.js",
            "three/addons/": "/node_modules/three/examples/jsm/",
            "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.min.js",
            "@pixiv/three-vrm-animation": "/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.min.js"
        }
    }
    </script>
</head>
<body>
    <div id="stage"></div>
    <script type="module" src="js/virtual.js"></script>
</body>
</html>
